<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <g stroke-width="40" stroke-linecap="round" stroke="black">
        <!--Fingers go from bottom to up-->
        <!--Thumb-->
        <line x1="75" y1="290" x2="75" y2="190"/>
        <!--First finger-->
        <line x1="140" y1="180" x2="140" y2="60"/>
        <!--Middle finger-->
        <line x1="190" y1="165" x2="190" y2="30"/>
        <!--Ring finger-->
        <line x1="240" y1="170" x2="240" y2="55"/>
        <!--Pinkie finger-->
        <line x1="290" y1="205" x2="290" y2="110"/>
    </g>
    <!--Palm-->
    <circle cx="200" cy="290" r="100" fill="black"/>
</svg>